services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: regpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: regpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - regpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regpilot -d regpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  regpilot_pgdata:
