name: RegPilot continuous public watch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/continuous-public-watch.yml']
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regpilot-public-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REGPILOT_VERIFIED_CODE_SHA: 51c90305d05b22acb99a23985d14871e5d177f1b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 51c90305d05b22acb99a23985d14871e5d177f1b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Restore last good public-source hashes
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: artifacts/source-history.json
          key: source-watch-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-watch-v1-${{ github.ref }}-
      - name: Retrieve official text and compare against last good captures
        run: node --import tsx scripts/verify-regulatory-sources.mjs
      - name: Discover newly published and updated official material
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/collect-horizon.mjs
      - name: Verify real GitHub API contract with repository-scoped credentials
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/verify-live-integrations.mjs
      - name: Verify optional infrastructure read contracts
        if: ${{ !cancelled() }}
        env:
          REGPILOT_VERCEL_PROJECT_ID: ${{ vars.REGPILOT_VERCEL_PROJECT_ID }}
          REGPILOT_VERCEL_TEAM_ID: ${{ vars.REGPILOT_VERCEL_TEAM_ID }}
          REGPILOT_VERCEL_READ_TOKEN: ${{ secrets.REGPILOT_VERCEL_READ_TOKEN }}
          REGPILOT_SUPABASE_PROJECT_REF: ${{ vars.REGPILOT_SUPABASE_PROJECT_REF }}
          REGPILOT_SUPABASE_ORGANIZATION_ID: ${{ vars.REGPILOT_SUPABASE_ORGANIZATION_ID }}
          REGPILOT_SUPABASE_READ_TOKEN: ${{ secrets.REGPILOT_SUPABASE_READ_TOKEN }}
        run: node --import tsx scripts/verify-infrastructure-integrations.mjs
      - name: Preserve known source hashes through partial outages
        if: ${{ !cancelled() && hashFiles('artifacts/source-history.json') != '' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: artifacts/source-history.json
          key: source-watch-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: official-uk-source-probe
          path: artifacts/*.json
          retention-days: 30

  publish:
    needs: probe
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    env:
      REGPILOT_VERIFIED_CODE_SHA: 51c90305d05b22acb99a23985d14871e5d177f1b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 51c90305d05b22acb99a23985d14871e5d177f1b
          persist-credentials: false
          sparse-checkout: scripts/publish-horizon.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: official-uk-source-probe
          path: artifacts
      - name: Validate and publish only public metadata to the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish-horizon.py
