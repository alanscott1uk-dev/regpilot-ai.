name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regpilot-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: regpilot
          POSTGRES_PASSWORD: regpilot-test-only
          POSTGRES_DB: regpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regpilot -d regpilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://regpilot:regpilot-test-only@localhost:5432/regpilot?schema=public
      REGPILOT_AI_DAILY_USER_LIMIT: "2"
      REGPILOT_AI_DAILY_ORG_LIMIT: "3"
      REGPILOT_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npx tsc --noEmit
      # Isolated disposable CI database only, not a live migration.
      - run: npx prisma db push --schema fixtures/schema-b857436.prisma --skip-generate
      - run: npx prisma db execute --file prisma/changes/obligation-intelligence.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/monitoring-semantic.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/evidence-assurance.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/programme-operations.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/obligation-library.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/team-access.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/paid-services.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/auditor-workspace.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/people-vendor-assurance.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/audit-evidence-requests.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/change-response.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/assurance-operations.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/connected-supplier-signals.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/worker-runtime.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/fair-dispatch.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file prisma/changes/worker-capacity.sql --schema prisma/schema.prisma
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      # Protect Prisma tables from Supabase Data API roles and test the policy
      # using a disposable PostgreSQL 17 instance; NEVER run this fixture on Supabase.
      - run: npx prisma db execute --file security/test-role-setup.sql --schema prisma/schema.prisma
      - run: npx prisma db execute --file security/supabase-private-tables.sql --schema prisma/schema.prisma
      - run: node --import tsx --test tests/private-tables.integration.test.ts
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:pdf-runtime
      - run: npm run test:smoke
