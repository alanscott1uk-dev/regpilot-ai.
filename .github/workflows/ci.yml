name: CI (manual verification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://regpilot:dummy@localhost:5432/regpilot?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run build
