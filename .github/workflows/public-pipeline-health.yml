name: Independent public pipeline watchdog
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-pipeline-health.yml']
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regpilot-pipeline-watchdog
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7a58c2bc060a416dc95be884fc807f58854996fd
          persist-credentials: false
          sparse-checkout: |
            scripts/check-horizon-health.py
            scripts/publish-horizon.py
          sparse-checkout-cone-mode: false
      - name: Check published data independently of collection jobs
        run: python scripts/check-horizon-health.py
