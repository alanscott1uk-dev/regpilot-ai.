name: Live integration catalogue
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx scripts/check-live-integration-directory.ts
      - name: Read and evaluate three public pharmaceutical registers twice
        run: node --import tsx scripts/check-live-pharma-registers.ts
      - name: Read GLEIF and OpenSSF public source records twice
        run: node --import tsx scripts/check-live-public-evidence.ts
      - name: Read actual repository workflow decisions and jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/check-live-workflow-evidence.ts
      - uses: actions/upload-artifact@v4
        with:
          name: public-provider-evidence
          path: |
            live-pharma-registers.json
            live-public-evidence.json
            live-workflow-evidence.json
          retention-days: 14
  identity-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify credential rotation and policy drift on a real identity server
        shell: bash
        run: |
          set -euo pipefail
          export KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          docker run -d --name regpilot-idp -p 127.0.0.1:8180:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=regpilot-test-admin -e KC_BOOTSTRAP_ADMIN_PASSWORD quay.io/keycloak/keycloak:26.3.5 start-dev
          trap 'docker rm -f regpilot-idp >/dev/null' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 2 --retry-all-errors http://127.0.0.1:8180/realms/master/.well-known/openid-configuration -o /dev/null
          node --import tsx scripts/check-live-keycloak.ts
      - uses: actions/upload-artifact@v4
        with:
          name: identity-server-monitoring-evidence
          path: live-keycloak-evidence.json
          retention-days: 14
  instrument-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install asyncua==1.1.8
      - run: python scripts/check-live-instrument.py
      - uses: actions/upload-artifact@v4
        with:
          name: instrument-protocol-evidence
          path: live-instrument-evidence.json
          retention-days: 14
  private-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify a running model before and after credential rotation
        shell: bash
        run: |
          set -euo pipefail
          revision=c6f2d396a5faa22c9722908d47e8da81a5d8cebc
          file=SmolLM2-135M-Instruct-Q4_K_M.gguf
          base=https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF
          expected=$(curl -fsSL --retry 2 "$base/raw/$revision/$file" | sed -nE 's/^oid sha256:([a-f0-9]{64})$/\1/p')
          test "${#expected}" = 64
          curl -fsSL --retry 2 "$base/resolve/$revision/$file" -o "$RUNNER_TEMP/regpilot-model.gguf"
          echo "$expected  $RUNNER_TEMP/regpilot-model.gguf" | sha256sum -c -
          docker run -d --name regpilot-model -p 127.0.0.1:8186:8080 -v "$RUNNER_TEMP/regpilot-model.gguf:/models/test.gguf:ro" ghcr.io/ggml-org/llama.cpp:server-b8840@sha256:1a706b41321c3d3e570b9a63cc768039f7bfe0487070ff6cf790f892b8e74831 -m /models/test.gguf --alias regpilot-test --host 0.0.0.0 --port 8080 -c 4096 -t 2
          trap 'docker rm -f regpilot-model >/dev/null' EXIT
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8186/health -o /dev/null
          node --import tsx scripts/check-live-private-model.ts
      - uses: actions/upload-artifact@v4
        with:
          name: private-model-evidence
          path: live-private-model.json
          retention-days: 14
  database-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, clickhouse]
    permissions:
      contents: read
    services:
      workspace-db:
        image: postgres:17
        env:
          POSTGRES_USER: regpilot
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: regpilot
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U regpilot" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://regpilot:acceptance-only@localhost:5432/regpilot?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read real database rows and rotate the source credential
        run: python3 scripts/check-database-source.py ${{ matrix.engine }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma db push
      - name: Admit the real collector receipts through the RegPilot observations API
        env:
          REGPILOT_DATABASE_ACCEPTANCE_ENVELOPES: database-acceptance-envelopes.json
        run: node --import tsx --test --test-name-pattern='database connector receipts' tests/customer-api.integration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: database-source-${{ matrix.engine }}
          path: live-${{ matrix.engine }}-evidence.json
          retention-days: 14
