name: Live integration catalogue
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx scripts/check-live-integration-directory.ts
      - name: Read GLEIF and OpenSSF public source records twice
        run: node --import tsx scripts/check-live-public-evidence.ts
      - uses: actions/upload-artifact@v4
        with:
          name: public-provider-evidence
          path: live-public-evidence.json
          retention-days: 14
