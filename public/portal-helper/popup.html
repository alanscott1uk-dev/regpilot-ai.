<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RegPilot questionnaire helper</title><style>body{width:360px;font:15px/1.5 system-ui;padding:12px;color:#16252e}button,input{display:block;margin:.7em 0;padding:.4em}[hidden]{display:none}label{display:block}p{overflow-wrap:anywhere}details{margin-top:1em}</style></head><body>
<h1>Questionnaire helper</h1><p id="paired">Open this helper on the buyer questionnaire to start a review in RegPilot.</p>
<button hidden id="review">Return to the RegPilot review tab</button><button id="start">Start a questionnaire from this buyer page</button><button id="send" disabled>Send field labels for review</button><p id="preview"></p><button disabled id="apply">Fill the reviewed blank fields</button><p id="status" role="status"></p>
<details><summary>Use files instead</summary><button id="capture">Download the portal’s field labels</button><label>Reviewer’s hand-off file<input type="file" id="ticket" accept=".json"></label></details>
<script type="module" src="popup.js"></script></body></html>
